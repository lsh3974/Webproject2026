<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app bg-light d-flex flex-column min-vh-100">

<header class="ui-header">
    <div class="container ui-header-inner justify-content-between">
        <a class="ui-brand" th:href="@{/}">
            <span class="ui-brand-symbol">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="m5 9 4-6m10 6-4-6M3 9h18l-2 11H5L3 9Z"/>
                    <path d="M9 12v5m6-5v5"/>
                </svg>
            </span>
            <span>
                <strong>시흥한바구니</strong>
                <small>OUR NEIGHBORHOOD MARKET</small>
            </span>
        </a>
        <a th:href="@{/}" class="text-secondary small text-decoration-none">&larr; 홈으로 돌아가기</a>
    </div>
</header>

<main id="main" class="container ui-main py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5 col-xl-4">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 mb-2">WELCOME BACK</span>
                    <h1 class="h3 fw-bold mb-1">로그인</h1>
                    <p class="text-secondary small mb-0">동네 장보기 시흥한바구니에 오신 것을 환영합니다.</p>
                </div>

                <div th:if="${param.error != null}"
                     class="alert alert-danger rounded-3 small" role="alert">
                    로그인할 수 없습니다. 이메일·비밀번호 또는 계정 상태를 확인해주세요.
                </div>

                <div th:if="${param.logout != null}"
                     class="alert alert-success rounded-3 small" role="status">
                    성공적으로 로그아웃되었습니다.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            이메일 주소
                        </label>
                        <input type="email"
                               id="email"
                               name="email"
                               class="form-control"
                               autocomplete="username"
                               maxlength="255"
                               placeholder="example@email.com"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            비밀번호
                        </label>
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               autocomplete="current-password"
                               placeholder="비밀번호 입력"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-success w-100 fw-semibold py-2">
                        로그인
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-secondary">
                    아직 회원이 아니신가요?
                    <a th:href="@{/signup}" class="text-success fw-semibold text-decoration-none ms-1">회원가입하기</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/ui :: footer}"></div>

</body>
</html>
