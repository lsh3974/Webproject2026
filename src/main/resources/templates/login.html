<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 시흥한바구니</title>

    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-auth">
<div th:replace="~{fragments/ui :: buyerHeader}"></div>

<main id="main" class="container ui-main">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <a th:href="@{/}" class="text-success text-decoration-none">
                ← 시흥한바구니 홈
            </a>

            <div class="card border-0 shadow-sm mt-3">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">로그인</h1>

                    <div th:if="${param.error != null}"
                         class="alert alert-danger" role="alert">
                        로그인할 수 없습니다.
                        이메일·비밀번호 또는 계정 상태를 확인해주세요.
                    </div>

                    <div th:if="${param.logout != null}"
                         class="alert alert-success" role="status">
                        로그아웃되었습니다.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                이메일
                            </label>
                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control"
                                   autocomplete="username"
                                   maxlength="255"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                비밀번호
                            </label>
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   autocomplete="current-password"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-success w-100">
                            로그인
                        </button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        아직 회원이 아니신가요?
                        <a th:href="@{/signup}">회원가입</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/ui :: footer}"></div>
</body>
</html>
