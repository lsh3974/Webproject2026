<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>한바구니 결제</title>

    <th:block th:replace="~{fragments/ui :: assets}"></th:block>

    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body class="ui-app ui-order ui-payment">
<div th:replace="~{fragments/ui :: buyerHeader}"></div>
<main id="main" class="container ui-main">

<section id="payment-page"
      class="ui-payment-panel"
      th:attr="
        data-order-id=${order.id},
        data-status=${order.status.name()},
        data-mode=${mode},
        data-client-key=${clientKey},
        data-customer-key=${customerKey},
        data-success-url=${successUrl},
        data-fail-url=${failUrl}">

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <span class="ui-kicker">CHECK YOUR ORDER</span><h1 class="h4 mb-4">공동구매 결제</h1>
<div class="ui-payment-product"><strong th:text="${order.groupPurchase.product.name}">상품명</strong><p><span th:text="${order.quantity}">1</span>개 · 판매 단위 <span th:text="${order.groupPurchase.product.unit}">1팩</span><br><span th:text="${order.groupPurchase.store.name}">수령 매장</span></p></div>

            <p>
                주문번호:
                <strong th:text="${order.id}"></strong>
            </p>

            <p>
                결제 금액:
                <strong th:text="${#numbers.formatInteger(
                    order.totalPrice, 1, 'COMMA')}"></strong>원
            </p>

            <p class="text-muted">
                테스트 결제로 진행됩니다.
            </p>

            <div id="payment-message"
                 class="alert alert-secondary"
                 role="status"
                 aria-live="polite">
                결제 정보를 확인하고 있습니다.
            </div>

            <div class="d-flex flex-wrap gap-2">
                <button id="pay-button"
                        type="button"
                        class="btn btn-success"
                        hidden>
                    테스트 결제하기
                </button>

                <button id="retry-button"
                        type="button"
                        class="btn btn-outline-primary"
                        hidden>
                    결제 결과 다시 확인
                </button>

                <form th:if="${order.status.name() == 'PENDING' and mode != 'success'}"
                      th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post">
                    <button type="submit" class="btn btn-outline-danger">예약 취소하고 수량 반환</button>
                </form>

                <a class="btn btn-outline-secondary"
                   th:href="@{/orders/{id}(id=${order.id})}">
                    주문 상세
                </a>
            </div>
        </div>
    </div>
</section>
</main>
<div th:replace="~{fragments/ui :: footer}"></div>

<script th:src="@{/js/payment.js}"></script>
</body>
</html>
