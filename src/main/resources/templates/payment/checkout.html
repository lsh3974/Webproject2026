<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>한바구니 결제 - 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>

    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body class="ui-app ui-buyer bg-light">

<div th:replace="~{fragments/ui :: buyerHeader}"></div>

<main id="payment-page"
      class="container ui-main py-5"
      style="max-width: 680px"
      th:attr="
        data-order-id=${order.id},
        data-status=${order.status.name()},
        data-mode=${mode},
        data-client-key=${clientKey},
        data-customer-key=${customerKey},
        data-success-url=${successUrl},
        data-fail-url=${failUrl}">

    <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-5">
        <div class="mb-4">
            <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 mb-2">TOSS PAYMENTS</span>
            <h1 class="h3 fw-bold mb-1">공동구매 결제</h1>
            <p class="text-secondary small mb-0">주문 내역을 확인하시고 토스페이먼츠 안전 결제를 진행해주세요.</p>
        </div>

        <div class="p-3 bg-light rounded-4 border mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-secondary small">주문 번호</span>
                <span class="badge bg-white text-dark border">#<span th:text="${order.id}">1</span></span>
            </div>

            <div class="d-flex justify-content-between align-items-baseline pt-2 border-top">
                <span class="fw-semibold text-dark">총 결제 금액</span>
                <strong class="fs-3 text-success">
                    <span th:text="${#numbers.formatInteger(order.totalPrice, 1, 'COMMA')}">10,000</span>원
                </strong>
            </div>

            <p class="text-muted small mb-0 mt-2">
                &bull; 테스트 결제 모드로 동작하며 실제 금액이 청구되지 않습니다.
            </p>
        </div>

        <div id="payment-message"
             class="alert alert-secondary rounded-3 small mb-4"
             role="status"
             aria-live="polite">
            결제 정보를 확인하고 있습니다.
        </div>

        <div class="d-flex flex-wrap gap-2 pt-2 border-top">
            <button id="pay-button"
                    type="button"
                    class="btn btn-success fw-semibold flex-fill py-2"
                    hidden>
                결제 진행하기
            </button>

            <button id="retry-button"
                    type="button"
                    class="btn btn-outline-primary fw-semibold flex-fill py-2"
                    hidden>
                결제 결과 다시 확인
            </button>

            <form th:if="${order.status.name() == 'PENDING' and mode != 'success'}"
                  th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger py-2">예약 취소 (수량 반환)</button>
            </form>

            <a class="btn btn-outline-secondary py-2"
               th:href="@{/orders/{id}(id=${order.id})}">
                주문 상세로
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/ui :: footer}"></div>

<script th:src="@{/js/payment.js}"></script>
</body>
</html>
