<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>접근 권한 없음 | 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-auth">
<div th:replace="~{fragments/ui :: buyerHeader}"></div>
<main id="main" class="container ui-main">
    <div class="card border-0 shadow-sm mx-auto text-center"
         style="max-width: 540px;">
        <div class="card-body p-5">
            <p class="text-secondary fw-semibold">403 Forbidden</p>
            <h1 class="h3 mb-3">접근 권한이 없어요</h1>
            <p class="text-secondary mb-4">
                현재 로그인한 계정으로는 이 페이지를 이용할 수 없어요.
            </p>
            <a th:href="@{/}" class="btn btn-success">
                홈으로 돌아가기
            </a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/ui :: footer}"></div>
</body>
</html>
