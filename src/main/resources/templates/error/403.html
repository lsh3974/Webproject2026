<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>접근 권한 없음 | 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app bg-light d-flex flex-column min-vh-100">

<header class="ui-header">
    <div class="container ui-header-inner justify-content-between">
        <a class="ui-brand" th:href="@{/}">
            <span class="ui-brand-symbol">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="m5 9 4-6m10 6-4-6M3 9h18l-2 11H5L3 9Z"/>
                    <path d="M9 12v5m6-5v5"/>
                </svg>
            </span>
            <span>
                <strong>시흥한바구니</strong>
                <small>OUR NEIGHBORHOOD MARKET</small>
            </span>
        </a>
        <a th:href="@{/}" class="text-secondary small text-decoration-none">&larr; 홈으로 이동</a>
    </div>
</header>

<main id="main" class="container ui-main py-5 my-auto text-center" style="max-width: 540px;">
    <div class="card border-0 shadow-sm rounded-4 bg-white p-5">
        <div class="display-3 mb-3" aria-hidden="true">🔒</div>
        <span class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-1 mb-2 align-self-center">403 FORBIDDEN</span>
        <h1 class="h3 fw-bold mb-2">접근 권한이 없습니다</h1>
        <p class="text-secondary small mb-4">
            현재 로그인한 계정의 권한으로는 요청하신 페이지에 접근할 수 없습니다.<br>
            판매자 전용 기능인지 또는 다른 계정인지 확인해주세요.
        </p>
        <div>
            <a th:href="@{/}" class="btn btn-success px-4 py-2 fw-semibold">
                홈으로 돌아가기
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/ui :: footer}"></div>

</body>
</html>
