<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>알림 수신 설정 · 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-notifications">
<div th:replace="~{fragments/ui :: notificationHeader}"></div>
<main id="main" class="container ui-main notification-page">
    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <header class="notification-page-heading">
        <div>
            <h1>알림 수신 설정</h1>
            <p class="text-secondary">웹 알림은 항상 알림함에 표시됩니다.</p>
        </div>
        <a class="btn btn-outline-success" th:href="@{/notifications}">알림함으로</a>
    </header>
    <form th:action="@{/notifications/preferences}" th:object="${form}" method="post" class="card">
        <div class="card-body">
            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" role="switch" id="emailEnabled" th:field="*{emailEnabled}">
                <label class="form-check-label fw-semibold" for="emailEnabled">이메일 알림</label>
                <div class="form-text" th:text="${contactStatus.emailVerified ? '확인된 이메일: ' + contactStatus.email : '이메일 주소가 확인되지 않아 발송되지 않습니다.'}">확인된 이메일 주소로 발송합니다. SMTP 설정이 필요합니다.</div>
            </div>
            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" role="switch" id="smsEnabled" th:field="*{smsEnabled}">
                <label class="form-check-label fw-semibold" for="smsEnabled">문자(SMS/LMS) 알림</label>
                <div class="form-text" th:text="${contactStatus.phoneVerified ? '확인된 휴대전화: ' + contactStatus.maskedPhone : '휴대전화 번호가 확인되지 않아 발송되지 않습니다.'}">확인된 휴대전화 번호로 SOLAPI를 통해 발송합니다.</div>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" role="switch" id="pushEnabled" th:field="*{pushEnabled}">
                <label class="form-check-label fw-semibold" for="pushEnabled">브라우저 푸시 알림</label>
                <div class="form-text">브라우저 알림 권한과 이 기기의 구독 등록이 필요합니다.</div>
            </div>
            <button type="submit" class="btn btn-success">설정 저장</button>
        </div>
    </form>
    <section class="card mt-3" aria-labelledby="browser-push-heading">
        <div class="card-body">
            <h2 id="browser-push-heading">이 브라우저 연결</h2>
            <p class="text-secondary small">푸시 수신을 켠 뒤 이 기기를 등록하세요. 브라우저 알림 권한이 거절되면 브라우저 설정에서 다시 허용해야 합니다.</p>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" id="enablePushButton" class="btn btn-outline-success"
                        th:attr="data-vapid-public-key=${vapidPublicKey}" th:disabled="${!pushConfigured}">이 브라우저에서 푸시 켜기</button>
                <button type="button" id="disablePushButton" class="btn btn-outline-secondary">이 브라우저 연결 해제</button>
            </div>
            <p id="pushStatus" class="small text-secondary mt-3 mb-0" role="status" aria-live="polite"></p>
            <p th:if="${!pushConfigured}" class="alert alert-warning small mt-3 mb-0">현재 브라우저 푸시를 설정할 수 없습니다.</p>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/ui :: footer}"></footer>
</body>
</html>
