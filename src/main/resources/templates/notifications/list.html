<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>알림함 · 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-buyer bg-light">

<div th:replace="~{fragments/ui :: buyerHeader}"></div>

<main id="main" class="container ui-main py-4" style="max-width: 880px">
    <div th:if="${successMessage}" class="alert alert-success rounded-3 mb-3" th:text="${successMessage}"></div>

    <header class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 mb-1">NOTIFICATIONS</span>
            <h1 class="h3 fw-bold mb-1">알림함</h1>
            <p class="text-secondary small mb-0">결제, 공동구매 모집, 환불 및 매장 수령 소식을 확인하세요.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-success btn-sm fw-semibold" th:href="@{/notifications/preferences}">
                ⚙ 수신 설정
            </a>
            <form th:action="@{/notifications/read-all}" method="post" class="m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">모두 읽음</button>
            </form>
        </div>
    </header>

    <section class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
        <div class="list-group list-group-flush" th:if="${!#lists.isEmpty(notifications)}">
            <form th:each="item : ${notifications}" th:action="@{/notifications/{id}/read(id=${item.id})}" method="post"
                  class="list-group-item list-group-item-action p-0 border-bottom">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="w-100 text-start border-0 bg-transparent p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div class="min-w-0 flex-grow-1">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span class="fw-bold text-dark" th:text="${item.title}">알림 제목</span>
                                <span th:if="${!item.read}" class="badge bg-success text-white">NEW</span>
                            </div>
                            <p class="mb-1 text-secondary small" th:text="${item.body}">알림 내용</p>
                            <small class="text-muted" th:text="${#temporals.format(item.createdAt, 'yyyy.MM.dd HH:mm')}">발생 시각</small>
                        </div>
                        <span class="text-success fs-5" aria-hidden="true">&rsaquo;</span>
                    </div>
                </button>
            </form>
        </div>
        <div th:if="${#lists.isEmpty(notifications)}" class="card-body text-center py-5">
            <div class="display-6 mb-2" aria-hidden="true">🔔</div>
            <h2 class="h5 fw-bold">아직 알림이 없습니다</h2>
            <p class="text-secondary small mb-0">주문이나 공동구매 상태가 변경되면 이곳에서 알려드릴게요.</p>
        </div>
    </section>
</main>

<div th:replace="~{fragments/ui :: footer}"></div>

</body>
</html>
