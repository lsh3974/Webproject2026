<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>알림함 · 시흥한바구니</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
<nav class="navbar bg-white border-bottom">
    <div class="container d-flex align-items-center gap-3">
        <a class="navbar-brand fw-bold text-success" th:href="@{/}">시흥한바구니</a>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/orders}">내 주문</a>
        <span class="ms-auto" sec:authorize="isAuthenticated()" th:text="${#authentication.principal.displayName + '님'}">회원님</span>
        <a class="btn btn-outline-success btn-sm" th:href="@{/notifications/preferences}">수신 설정</a>
    </div>
</nav>
<main class="container py-4" style="max-width: 880px">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div><h1 class="h3 fw-bold mb-1">알림함</h1><p class="text-secondary mb-0">결제, 공동구매 모집, 환불 및 매장 수령 소식을 확인하세요.</p></div>
        <form th:action="@{/notifications/read-all}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-secondary btn-sm">모두 읽음</button>
        </form>
    </header>
    <section class="card border-0 shadow-sm">
        <div class="list-group list-group-flush" th:if="${!#lists.isEmpty(notifications)}">
            <form th:each="item : ${notifications}" th:action="@{/notifications/{id}/read(id=${item.id})}" method="post"
                  class="list-group-item list-group-item-action p-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="w-100 text-start border-0 bg-transparent p-3">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div class="min-w-0">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span class="fw-semibold" th:text="${item.title}">알림 제목</span>
                                <span th:if="${!item.read}" class="badge text-bg-success">새 알림</span>
                            </div>
                            <p class="mb-1 text-secondary" th:text="${item.body}">알림 내용</p>
                            <small class="text-muted" th:text="${#temporals.format(item.createdAt, 'yyyy.MM.dd HH:mm')}">발생 시각</small>
                        </div>
                        <span class="text-success" aria-hidden="true">›</span>
                    </div>
                </button>
            </form>
        </div>
        <div th:if="${#lists.isEmpty(notifications)}" class="card-body text-center py-5">
            <div class="display-6 mb-2" aria-hidden="true">🔔</div>
            <h2 class="h5">아직 알림이 없습니다</h2>
            <p class="text-secondary mb-0">주문이나 공동구매 상태가 변경되면 이곳에서 알려드릴게요.</p>
        </div>
    </section>
</main>
</body>
</html>
