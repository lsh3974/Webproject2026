<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>알림함 · 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-notifications">
<div th:replace="~{fragments/ui :: notificationHeader}"></div>
<main id="main" class="container ui-main notification-page">
    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <header class="notification-page-heading">
        <div>
            <h1>알림함</h1>
            <p class="text-secondary" th:text="|읽지 않은 알림 ${unreadCount}개|">읽지 않은 알림 0개</p>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-success" th:href="@{/notifications/preferences}">수신 설정</a>
            <form th:if="${unreadCount > 0}" th:action="@{/notifications/read-all}" method="post">
                <button type="submit" class="btn btn-outline-secondary">모두 읽음</button>
            </form>
        </div>
    </header>
    <section class="card" aria-label="알림 목록">
        <div th:if="${!#lists.isEmpty(notifications)}">
            <form th:each="item : ${notifications}" th:action="@{/notifications/{id}/read(id=${item.id})}" method="post">
                <button type="submit" class="notification-dropdown-item" th:classappend="${!item.read} ? 'unread'">
                    <span class="notification-dropdown-copy">
                        <span class="notification-dropdown-title">
                            <span th:text="${item.title}">알림 제목</span>
                            <span th:if="${!item.read}" class="ui-pill">새 알림</span>
                        </span>
                        <span class="notification-item-body" th:text="${item.body}">알림 내용</span>
                        <time class="notification-dropdown-time" th:datetime="${item.createdAt}"
                              th:text="${#temporals.format(item.createdAt, 'yyyy.MM.dd HH:mm')}">발생 시각</time>
                    </span>
                    <span class="text-success" aria-hidden="true">›</span>
                </button>
            </form>
        </div>
        <div th:if="${#lists.isEmpty(notifications)}" class="card-body text-center py-5">
            <h2 class="h5 mb-0">아직 알림이 없습니다</h2>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/ui :: footer}"></footer>
</body>
</html>
