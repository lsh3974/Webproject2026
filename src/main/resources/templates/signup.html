<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | 시흥한바구니</title>

    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-auth">
<div th:replace="~{fragments/ui :: buyerHeader}"></div>

<main id="main" class="container ui-main">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <a th:href="@{/}" class="text-success text-decoration-none">
                ← 시흥한바구니 홈
            </a>

            <div class="card border-0 shadow-sm mt-3">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">회원가입</h1>

                    <div th:if="${param.success != null}"
                         class="alert alert-success" role="status">
                        회원가입이 완료되었습니다.
                    </div>

                    <form th:action="@{/signup}"
                          th:object="${signupForm}"
                          method="post">

                        <div th:if="${#fields.hasGlobalErrors()}"
                             class="alert alert-danger" role="alert">
                            <p th:each="error : ${#fields.globalErrors()}"
                               th:text="${error}"
                               class="mb-0"></p>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                이메일
                            </label>
                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   autocomplete="email"
                                   maxlength="255"
                                   required>
                            <p th:errors="*{email}"
                               class="text-danger small mt-1"></p>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                비밀번호
                            </label>
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   autocomplete="new-password"
                                   minlength="8"
                                   maxlength="72"
                                   aria-describedby="passwordHelp"
                                   required>
                            <div id="passwordHelp" class="form-text">
                                8자 이상 입력해주세요.
                            </div>
                            <p th:errors="*{password}"
                               class="text-danger small mt-1"></p>
                            <p th:errors="*{passwordWithinByteLimit}"
                               class="text-danger small mt-1"></p>
                        </div>

                        <div class="mb-4">
                            <label for="displayName" class="form-label">
                                닉네임을 입력해주세요
                            </label>
                            <input type="text"
                                   th:field="*{displayName}"
                                   class="form-control"
                                   autocomplete="nickname"
                                   maxlength="60"
                                   required>
                            <p th:errors="*{displayName}"
                               class="text-danger small mt-1"></p>
                        </div>

                        <button type="submit"
                                class="btn btn-success w-100">
                            가입하기
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/ui :: footer}"></div>
</body>
</html>
