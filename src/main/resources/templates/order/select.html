<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공동구매 선택 · 수량 예약 - 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-order ui-order-select">

<div th:replace="~{fragments/ui :: buyerHeader}"></div>

<main id="main" class="container ui-main">
    <div class="ui-section-top"><div>
        <h1 class="h3 fw-bold mb-1">수량 예약할 공동구매 선택</h1>
        <p class="text-secondary mb-0">현재 모집 중인 우리 동네 공동구매 상품을 선택해 수량을 예약하세요.</p>
    </div><a class="btn btn-outline-success" th:href="@{/orders}">내 주문·예약 보기</a></div>

    <div th:if="${#lists.isEmpty(openGroupPurchases)}" class="card border-0 shadow-sm text-center p-5">
        <div class="card-body">
            <p class="text-secondary fs-5 mb-2">현재 참여 가능한 공동구매 모집이 없습니다.</p>
            <a th:href="@{/group-purchases}" class="btn btn-outline-success mt-2">공동구매 둘러보기</a>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(openGroupPurchases)}" class="row g-4 ui-reservation-grid">
        <div class="col-12 col-md-6" th:each="gp : ${openGroupPurchases}">
            <div class="card ui-reservation-card h-100 border-0 shadow-sm">
                <div class="ui-product-media">
                    <img data-product-image loading="lazy" th:if="${gp.productImageUrl != null and !#strings.isEmpty(gp.productImageUrl)}" th:src="@{${gp.productImageUrl}}" th:alt="${gp.productName}">
                    <div class="ui-media-placeholder" th:unless="${gp.productImageUrl != null and !#strings.isEmpty(gp.productImageUrl)}">등록된 상품 사진 없음</div>
                </div>
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-success-subtle text-success border border-success-subtle"
                              th:text="${gp.storeName}">매장명</span>
                        <span class="badge bg-light text-dark border"
                              th:text="'잔여 수량 ' + ${gp.remainingQuantity}">잔여 수량 10</span>
                    </div>

                    <h2 class="h5 fw-bold mb-1" th:text="${gp.title}">공동구매 제목</h2>
                    <p class="text-muted small mb-3" th:text="${gp.productName} + ' · ' + ${gp.storeAddress}">상품명 · 주소</p>

                    <div class="fs-5 fw-bold text-success mb-3">
                        <span th:text="${#numbers.formatInteger(gp.groupPrice, 1, 'COMMA')}">10,000</span>원
                        <span class="fs-6 fw-normal text-secondary" th:text="'/ ' + ${gp.unit}">/ 개</span>
                    </div>

                    <div class="mt-auto d-grid">
                        <a th:if="${gp.orderable}"
                           th:href="@{/orders/new(groupPurchaseId=${gp.groupPurchaseId})}"
                           class="btn btn-success">
                            이 공동구매 예약하기
                        </a>
                        <button th:unless="${gp.orderable}"
                                type="button"
                                class="btn btn-outline-secondary"
                                disabled
                                th:text="${gp.unavailableReason != null ? gp.unavailableReason : '예약 불가'}">
                            예약 불가
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/ui :: footer}"></div>
</body>
</html>
