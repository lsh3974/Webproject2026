<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공동구매 선택 · 수량 예약 - 시흥한바구니</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom">
    <div class="container d-flex flex-wrap gap-3">
        <a class="navbar-brand fw-bold text-success" th:href="@{/}">시흥한바구니</a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/orders}" class="text-decoration-none text-secondary">내 주문·예약 내역</a>
            <a th:href="@{/}" class="text-decoration-none text-secondary">홈으로</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="mb-4">
        <h1 class="h3 fw-bold mb-1">수량 예약할 공동구매 선택</h1>
        <p class="text-secondary mb-0">현재 모집 중인 우리 동네 공동구매 상품을 선택해 수량을 예약하세요.</p>
    </div>

    <div th:if="${#lists.isEmpty(openGroupPurchases)}" class="card border-0 shadow-sm text-center p-5">
        <div class="card-body">
            <p class="text-secondary fs-5 mb-2">현재 참여 가능한 공동구매 모집이 없습니다.</p>
            <a th:href="@{/}" class="btn btn-outline-success mt-2">홈으로 돌아가기</a>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(openGroupPurchases)}" class="row g-4">
        <div class="col-12 col-md-6" th:each="gp : ${openGroupPurchases}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-success-subtle text-success border border-success-subtle"
                              th:text="${gp.storeName}">매장명</span>
                        <span class="badge bg-light text-dark border"
                              th:text="'잔여 ' + ${gp.remainingQuantity} + ${gp.unit}">잔여 10개</span>
                    </div>

                    <h2 class="h5 fw-bold mb-1" th:text="${gp.title}">공동구매 제목</h2>
                    <p class="text-muted small mb-3" th:text="${gp.productName} + ' · ' + ${gp.storeAddress}">상품명 · 주소</p>

                    <div class="fs-5 fw-bold text-success mb-3">
                        <span th:text="${#numbers.formatInteger(gp.groupPrice, 1, 'COMMA')}">10,000</span>원
                        <span class="fs-6 fw-normal text-secondary" th:text="'/ ' + ${gp.unit}">/ 개</span>
                    </div>

                    <div class="mt-auto d-grid">
                        <a th:if="${gp.orderable}"
                           th:href="@{/orders/new(groupPurchaseId=${gp.groupPurchaseId})}"
                           class="btn btn-success">
                            이 공동구매 예약하기
                        </a>
                        <button th:unless="${gp.orderable}"
                                type="button"
                                class="btn btn-outline-secondary"
                                disabled
                                th:text="${gp.unavailableReason != null ? gp.unavailableReason : '예약 불가'}">
                            예약 불가
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
