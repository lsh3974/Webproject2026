<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공동구매 선택 · 수량 예약 - 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-buyer bg-light">

<div th:replace="~{fragments/ui :: buyerHeader}"></div>

<main id="main" class="container ui-main py-4">
    <div class="mb-4">
        <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 mb-2">RESERVATION SELECT</span>
        <h1 class="h3 fw-bold mb-1">수량 예약할 공동구매 선택</h1>
        <p class="text-secondary small mb-0">현재 모집 중인 우리 동네 공동구매 상품을 선택해 수량을 예약하세요.</p>
    </div>

    <div th:if="${#lists.isEmpty(openGroupPurchases)}" class="card border-0 shadow-sm rounded-4 text-center p-5 bg-white">
        <div class="card-body">
            <div class="fs-1 mb-3">🛒</div>
            <p class="text-secondary fs-5 mb-2">현재 참여 가능한 공동구매 모집이 없습니다.</p>
            <p class="text-muted small mb-4">새로운 공동구매가 열리면 가장 먼저 알려드릴게요.</p>
            <a th:href="@{/}" class="btn btn-outline-success px-4 py-2">홈으로 돌아가기</a>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(openGroupPurchases)}" class="row g-4">
        <div class="col-12 col-md-6 col-lg-4" th:each="gp : ${openGroupPurchases}">
            <div class="card h-100 border-0 shadow-sm rounded-4 bg-white overflow-hidden">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1"
                              th:text="${gp.storeName}">매장명</span>
                        <span class="badge bg-light text-dark border px-2 py-1"
                              th:text="'잔여 ' + ${gp.remainingQuantity} + ${gp.unit}">잔여 10개</span>
                    </div>

                    <h2 class="h5 fw-bold mb-1 mt-2" th:text="${gp.title}">공동구매 제목</h2>
                    <p class="text-muted small mb-3" th:text="${gp.productName} + ' · ' + ${gp.storeAddress}">상품명 · 주소</p>

                    <div class="fs-5 fw-bold text-success mb-3 p-3 bg-light rounded-3">
                        <span th:text="${#numbers.formatInteger(gp.groupPrice, 1, 'COMMA')}">10,000</span>원
                        <span class="fs-6 fw-normal text-secondary" th:text="'/ ' + ${gp.unit}">/ 개</span>
                    </div>

                    <div class="mt-auto d-grid pt-2">
                        <a th:if="${gp.orderable}"
                           th:href="@{/orders/new(groupPurchaseId=${gp.groupPurchaseId})}"
                           class="btn btn-success fw-semibold">
                            이 공동구매 예약하기
                        </a>
                        <button th:unless="${gp.orderable}"
                                type="button"
                                class="btn btn-outline-secondary"
                                disabled
                                th:text="${gp.unavailableReason != null ? gp.unavailableReason : '예약 불가'}">
                            예약 불가
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/ui :: footer}"></div>

</body>
</html>
