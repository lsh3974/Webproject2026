<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>매장 정보 수정 - 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-seller bg-light">

<div th:replace="~{fragments/ui :: sellerHeader(${store})}"></div>

<main id="main" class="container ui-main py-4">
    <!-- 매장 정보 배너 -->
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle px-2 py-1 mb-1">MY STORE / SETTINGS</span>
                <h1 class="h3 fw-bold mb-1" th:text="${store.name} + ' 매장 설정'">매장 설정</h1>
                <p class="text-secondary small mb-0">매장의 기본 정보, 연락처, 영업 상태를 변경할 수 있습니다.</p>
            </div>
            <a th:href="@{/seller/stores}" class="btn btn-outline-secondary btn-sm">
                &larr; 매장 목록으로
            </a>
        </div>
    </div>

    <!-- 매장 관리 탭 네비게이션 -->
    <ul class="nav nav-pills mb-4 gap-2 bg-white p-2 rounded-3 shadow-sm">
        <li class="nav-item">
            <a class="nav-link text-secondary" th:href="@{/seller/stores/{id}/products(id=${store.id})}">상품 관리</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-secondary" th:href="@{/seller/stores/{id}/group-purchases(id=${store.id})}">공동구매 관리</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-secondary" th:href="@{/seller/stores/{id}/pickups(id=${store.id})}">📷 QR/수령 관리</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active bg-success text-white fw-semibold" th:href="@{/seller/stores/{id}/edit(id=${store.id})}">매장 정보 수정</a>
        </li>
    </ul>

    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <h2 class="h5 fw-bold mb-3">기본 정보 수정</h2>

                <form th:action="@{/seller/stores/{id}/edit(id=${store.id})}" th:object="${storeForm}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">매장 이름 *</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="businessNumber" class="form-label fw-semibold">사업자등록번호</label>
                        <input type="text" id="businessNumber" th:field="*{businessNumber}" class="form-control"
                               th:classappend="${#fields.hasErrors('businessNumber')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('businessNumber')}" th:errors="*{businessNumber}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">매장 전화번호 *</label>
                        <input type="text" id="phone" th:field="*{phone}" class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">매장 주소 *</label>
                        <input type="text" id="address" th:field="*{address}" class="form-control"
                               th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="addressDetail" class="form-label fw-semibold">상세 주소</label>
                        <input type="text" id="addressDetail" th:field="*{addressDetail}" class="form-control"
                               th:classappend="${#fields.hasErrors('addressDetail')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('addressDetail')}" th:errors="*{addressDetail}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label fw-semibold">영업 상태 *</label>
                        <select id="status" th:field="*{status}" class="form-select">
                            <option value="ACTIVE">영업중 (ACTIVE)</option>
                            <option value="CLOSED">휴업 / 임시종료 (CLOSED)</option>
                            <option value="SUSPENDED">정지 (SUSPENDED)</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">매장 소개</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-flex gap-2 pt-2 border-top">
                        <button type="submit" class="btn btn-success flex-fill fw-semibold">수정 완료</button>
                        <a th:href="@{/seller/stores}" class="btn btn-outline-secondary">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/ui :: footer}"></div>

</body>
</html>
