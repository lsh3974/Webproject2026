<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 매장 등록 - 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-seller">

<div th:replace="~{fragments/ui :: sellerHeader(null)}"></div>

<main id="main" class="container ui-main">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm p-4">
                <h1 class="h4 fw-bold mb-3">새 매장 등록</h1>
                <p class="text-secondary small mb-4">공동구매 상품을 수령할 매장 정보를 입력해주세요.</p>

                <form th:action="@{/seller/stores/new}" th:object="${storeForm}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">매장 이름 *</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                               placeholder="예: 정왕 마트 시흥점">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="businessNumber" class="form-label fw-semibold">사업자등록번호</label>
                        <input type="text" id="businessNumber" th:field="*{businessNumber}" class="form-control"
                               th:classappend="${#fields.hasErrors('businessNumber')} ? 'is-invalid' : ''"
                               placeholder="예: 123-45-67890 (선택)">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('businessNumber')}" th:errors="*{businessNumber}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">매장 전화번호 *</label>
                        <input type="text" id="phone" th:field="*{phone}" class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                               placeholder="예: 031-123-4567">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">매장 주소 *</label>
                        <input type="text" id="address" th:field="*{address}" class="form-control"
                               th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                               placeholder="예: 경기도 시흥시 산기대학로 237">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="addressDetail" class="form-label fw-semibold">상세 주소</label>
                        <input type="text" id="addressDetail" th:field="*{addressDetail}" class="form-control"
                               th:classappend="${#fields.hasErrors('addressDetail')} ? 'is-invalid' : ''"
                               placeholder="예: 1층 101호">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('addressDetail')}" th:errors="*{addressDetail}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">매장 소개</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                                  placeholder="신선한 과일과 채소를 취급하는 동네 마트입니다."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-fill">등록하기</button>
                        <a th:href="@{/seller/stores}" class="btn btn-outline-secondary">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/vendor/bootstrap.bundle.min.js}"></script>
<div th:replace="~{fragments/ui :: footer}"></div>
</body>
</html>
