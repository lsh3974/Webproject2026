<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>매장 관리 - 시흥한바구니</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom">
    <div class="container d-flex flex-wrap gap-3">
        <a class="navbar-brand fw-bold text-success" th:href="@{/}">
            시흥한바구니
        </a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/}" class="text-decoration-none text-secondary">홈으로</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-secondary">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">내 매장 관리</h1>
            <p class="text-secondary mb-0">등록된 매장을 관리하고 상품과 공동구매 모집을 등록하세요.</p>
        </div>
        <a th:href="@{/seller/stores/new}" class="btn btn-success">
            + 새 매장 등록
        </a>
    </div>

    <div th:if="${#lists.isEmpty(stores)}" class="card border-0 shadow-sm text-center p-5">
        <div class="card-body">
            <p class="text-secondary fs-5 mb-3">등록된 매장이 없습니다.</p>
            <p class="text-muted mb-4">공동구매 상품을 판매하려면 먼저 매장을 등록해주세요.</p>
            <a th:href="@{/seller/stores/new}" class="btn btn-success px-4">
                매장 등록하기
            </a>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(stores)}" class="row g-4">
        <div class="col-12 col-md-6 col-lg-4" th:each="store : ${stores}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h2 class="card-title h5 fw-bold mb-0" th:text="${store.name}">매장명</h2>
                        <span th:if="${store.status.name() == 'ACTIVE'}" class="badge bg-success">영업중</span>
                        <span th:if="${store.status.name() == 'CLOSED'}" class="badge bg-secondary">휴업/폐점</span>
                        <span th:if="${store.status.name() == 'SUSPENDED'}" class="badge bg-danger">정지</span>
                    </div>

                    <p class="card-text text-secondary small mb-2" th:text="${store.description}">매장 설명</p>

                    <div class="small text-muted mb-3 mt-auto">
                        <div><strong>전화:</strong> <span th:text="${store.phone}">031-000-0000</span></div>
                        <div><strong>주소:</strong> <span th:text="${store.address} + ' ' + (${store.addressDetail} != null ? ${store.addressDetail} : '')">주소</span></div>
                        <div th:if="${store.businessNumber}"><strong>사업자번호:</strong> <span th:text="${store.businessNumber}">123-45-67890</span></div>
                    </div>

                    <div class="d-flex flex-column gap-2 pt-2 border-top">
                        <div class="d-flex gap-2">
                            <a th:href="@{/seller/stores/{id}/products(id=${store.id})}" class="btn btn-primary btn-sm flex-fill">
                                상품 관리
                            </a>
                            <a th:href="@{/seller/stores/{id}/group-purchases(id=${store.id})}" class="btn btn-success btn-sm flex-fill">
                                공동구매 관리
                            </a>
                        </div>
                        <a th:href="@{/seller/stores/{id}/edit(id=${store.id})}" class="btn btn-outline-secondary btn-sm w-100">
                            매장 정보 수정
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
