<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>매장 수령 관리 & QR 체크 - 시흥한바구니</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
    <!-- QR 스캐너 라이브러리 (html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- QR 코드 생성 라이브러리 (테스트용 QR 렌더링용 qrcodejs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="ui-app ui-seller bg-light">

<div th:replace="~{fragments/ui :: sellerHeader(${store})}"></div>

<main class="container ui-main py-4">

    <!-- 매장 관리 탭 네비게이션 -->
    <ul class="nav nav-pills mb-4 gap-2 bg-white p-2 rounded-3 shadow-sm">
        <li class="nav-item">
            <a class="nav-link text-secondary" th:href="@{/seller/stores/{id}/products(id=${store.id})}">상품 관리</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-secondary" th:href="@{/seller/stores/{id}/group-purchases(id=${store.id})}">공동구매 관리</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active bg-success text-white fw-semibold" th:href="@{/seller/stores/{id}/pickups(id=${store.id})}">📷 QR/수령 관리</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-secondary" th:href="@{/seller/stores/{id}/edit(id=${store.id})}">매장 정보 수정</a>
        </li>
    </ul>

    <!-- 안내 메시지 -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Header Card -->
    <div class="card border-0 shadow-sm rounded-4 mb-4 bg-white">
        <div class="card-body p-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle mb-2" th:text="${store.status}">ACTIVE</span>
                <h1 class="h3 fw-bold mb-1" th:text="${store.name} + ' - 매장 수령 & QR 체크 (11번)'">매장 수령 관리</h1>
                <p class="text-secondary small mb-0">
                    공동구매 상품의 준비완료 처리 및 고객의 QR 코드 / 수령코드를 스캔하여 수령완료를 확정합니다.
                </p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/seller/stores/{id}/group-purchases(id=${store.id})}" class="btn btn-outline-secondary">
                    공동구매 목록
                </a>
                <button type="button" class="btn btn-primary" id="btnToggleTestOrderBox">
                    + 테스트용 주문(수령건) 생성
                </button>
            </div>
        </div>
    </div>
