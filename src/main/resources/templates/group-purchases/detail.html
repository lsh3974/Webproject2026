<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공동구매 상세 · 시흥한바구니</title>
<th:block th:replace="~{fragments/ui :: assets}">
</th:block>
</head>
<body class="ui-app ui-buyer">
<div th:replace="~{fragments/ui :: buyerHeader}">
</div>
<main id="main" class="container ui-main">
<nav class="ui-breadcrumb" aria-label="현재 위치">
<a th:href="@{/group-purchases}">공동구매 목록</a>
<span>/</span>
<span>상품 상세</span>
</nav>
<div class="ui-detail">
<div>
<div class="ui-detail-visual detail-image">
<img data-product-image th:if="${purchase.imageUrl != null and !#strings.isEmpty(purchase.imageUrl)}" th:src="@{${purchase.imageUrl}}" th:alt="${purchase.productName}">
<div data-image-fallback class="ui-media-placeholder" th:if="${purchase.imageUrl == null or #strings.isEmpty(purchase.imageUrl)}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
<path d="m5 9 4-6m10 6-4-6M3 9h18l-2 11H5L3 9Z"/>
<path d="M9 12v5m6-5v5"/>
</svg>
<span>등록된 상품 사진 없음</span>
</div>
</div>
<section class="ui-description">
<span class="ui-kicker">ABOUT THE PRODUCT</span>
<h2>상품 설명</h2>
<p class="ui-multiline" th:text="${purchase.description != null and !#strings.isEmpty(purchase.description) ? purchase.description : '아직 등록된 상세 설명이 없습니다.'}">상품 설명</p>
</section>
</div>
<section>
<span class="ui-pill">모집 중</span>
<h1 th:text="${purchase.title}">공동구매 제목</h1>
<p class="ui-muted">
<span th:text="${purchase.storeName}">매장</span> · <span th:text="${purchase.category}">분류</span>
</p>
<div class="ui-detail-price">
<div class="ui-price">
<span th:text="${#numbers.formatInteger(purchase.groupPrice,1,'COMMA')}">0</span>원<small th:text="'/ ' + ${purchase.unit}">/ 개</small>
</div>
</div>
<div class="ui-meter" aria-hidden="true">
<span th:style="|width:${purchase.progressPercent}%|">
</span>
</div>
<div class="ui-product-progress">
<span>목표 수량 대비 현황</span>
<strong th:text="|${purchase.progressPercent}%|">0%</strong>
</div>
<dl class="ui-facts">
<dt>상품명</dt>
<dd th:text="${purchase.productName}">상품</dd>
<dt>현재 / 목표</dt>
<dd th:text="${purchase.currentQuantity + ' / ' + purchase.targetQuantity}">수량</dd>
<dt>최대 모집 수량</dt>
<dd th:text="${purchase.maxQuantity}">수량</dd>
<dt>모집 기간</dt>
<dd>
<span th:text="${#temporals.format(purchase.startAt,'MM.dd HH:mm')}">
</span> ~ <span th:text="${#temporals.format(purchase.endAt,'MM.dd HH:mm')}">
</span>
</dd>
</dl>
<section class="ui-pickup">
<h2>매장에서 수령해요</h2>
<p>
<strong th:text="${purchase.storeName}">매장</strong>
<br>
<span th:text="${purchase.address}">주소</span>
</p>
<p>
<span th:text="${#temporals.format(purchase.pickupStartAt,'yyyy.MM.dd HH:mm')}">
</span>
<br>~ <span th:text="${#temporals.format(purchase.pickupEndAt,'yyyy.MM.dd HH:mm')}">
</span>
</p>
<p class="ui-multiline" th:if="${purchase.pickupNotice != null and !#strings.isEmpty(purchase.pickupNotice)}" th:text="${purchase.pickupNotice}">
</p>
</section>
<div class="ui-reservation-cta">
<p class="ui-muted">필요한 수량을 먼저 예약하고, 매장에서 수령할 일정을 확인하세요.</p>
<a class="btn btn-success w-100" th:href="@{/orders/new(groupPurchaseId=${purchase.id})}">수량 예약하기 →</a>
<p class="ui-signin-note" sec:authorize="isAnonymous()">수량 예약은 로그인 후 이용할 수 있어요.</p>
</div>
<a class="btn btn-outline-success w-100" th:href="@{/group-purchases}">다른 공동구매 둘러보기 →</a>
</section>
</div>
</main>
<div th:replace="~{fragments/ui :: footer}">
</div>
</body>
</html>
