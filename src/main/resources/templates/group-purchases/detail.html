<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${purchase.title + ' · 시흥한바구니'}">공동구매 상세</title>
    <th:block th:replace="~{fragments/ui :: assets}"></th:block>
</head>
<body class="ui-app ui-buyer bg-light">

<div th:replace="~{fragments/ui :: buyerHeader}"></div>

<main id="main" class="container ui-main py-4" style="max-width: 900px;">

    <div class="mb-3">
        <a th:href="@{/group-purchases}" class="text-decoration-none text-secondary small">
            &larr; 공동구매 목록으로 돌아가기
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
        <div class="row g-0">
            <!-- 좌측 이미지 영역 -->
            <div class="col-12 col-md-5 bg-light d-flex align-items-center justify-content-center p-3" style="min-height: 280px;">
                <img th:if="${purchase.imageUrl != null and !#strings.isEmpty(purchase.imageUrl)}"
                     th:src="@{${purchase.imageUrl}}" th:alt="${purchase.productName}"
                     class="img-fluid rounded-3 object-fit-cover shadow-sm w-100" style="max-height: 350px;">
                <div th:unless="${purchase.imageUrl != null and !#strings.isEmpty(purchase.imageUrl)}"
                     class="text-center text-muted p-4">
                    <span class="fs-1">🛍️</span>
                    <p class="small mb-0 mt-2">등록된 상품 사진 없음</p>
                </div>
            </div>

            <!-- 우측 상품 및 공구 핵심 정보 -->
            <div class="col-12 col-md-7 p-4 p-lg-5 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle px-3 py-2"
                          th:text="${purchase.storeName}">매장명</span>
                    <span class="badge bg-warning text-dark px-2 py-1">모집 중</span>
                </div>

                <div class="small text-muted mb-1">
                    <span th:text="${purchase.productName}">상품명</span> · 
                    <span th:text="${purchase.category}">카테고리</span>
                </div>

                <h1 class="h3 fw-bold mb-3" th:text="${purchase.title}">공동구매 제목</h1>

                <div class="mb-4">
                    <div class="text-muted small">공동구매 특별가</div>
                    <div class="d-flex align-items-baseline gap-2">
                        <span class="fs-2 fw-bold text-success"
                              th:text="${#numbers.formatInteger(purchase.groupPrice, 1, 'COMMA')} + '원'">12,000원</span>
                        <span class="text-secondary" th:text="'/ ' + ${purchase.unit}">/ 1개</span>
                    </div>
                </div>

                <!-- 달성 현황 카드 -->
                <div class="p-3 bg-light rounded-3 mb-4">
                    <div class="d-flex justify-content-between small fw-semibold mb-1">
                        <span>목표 달성률</span>
                        <span class="text-success" th:text="|${purchase.progressPercent}%|">0%</span>
                    </div>
                    <div class="progress mb-2" style="height: 10px;">
                        <div class="progress-bar bg-success"
                             th:style="'width: ' + ${purchase.progressPercent} + '%;'"></div>
                    </div>
                    <div class="d-flex justify-content-between text-secondary small">
                        <span>현재 예약: <strong th:text="${purchase.currentQuantity}">0</strong> <span th:text="${purchase.unit}">개</span></span>
                        <span>목표: <strong th:text="${purchase.targetQuantity}">0</strong> <span th:text="${purchase.unit}">개</span></span>
                    </div>
                </div>

                <!-- 수량 예약 CTA 버튼 -->
                <div class="mt-auto d-grid gap-2">
                    <a class="btn btn-success btn-lg fw-bold py-3 rounded-3"
                       th:href="@{/orders/new(groupPurchaseId=${purchase.id})}">
                        이 공동구매 수량 예약하기 →
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 상세 정보 탭/섹션 -->
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mb-4 bg-white">
        <h2 class="h5 fw-bold mb-3 pb-2 border-bottom">공동구매 및 수령 정보</h2>

        <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
                <div class="text-muted small mb-1">📅 모집 기간</div>
                <div class="fw-semibold">
                    <span th:text="${#temporals.format(purchase.startAt, 'yyyy.MM.dd HH:mm')}"></span> ~ 
                    <span th:text="${#temporals.format(purchase.endAt, 'yyyy.MM.dd HH:mm')}"></span>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="text-muted small mb-1">📦 수령 기간</div>
                <div class="fw-semibold">
                    <span th:text="${#temporals.format(purchase.pickupStartAt, 'yyyy.MM.dd HH:mm')}"></span> ~ 
                    <span th:text="${#temporals.format(purchase.pickupEndAt, 'yyyy.MM.dd HH:mm')}"></span>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <div class="text-muted small mb-1">📍 수령 매장 주소</div>
                <div class="fw-semibold" th:text="${purchase.address}">경기도 시흥시 산기대학로 237</div>
            </div>

            <div class="col-12 col-md-6">
                <div class="text-muted small mb-1">⚠️ 1인당 최대 주문 제한</div>
                <div class="fw-semibold">
                    <span th:text="${purchase.maxQuantity}">0</span> <span th:text="${purchase.unit}">개</span>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <div class="text-muted small mb-1">📢 수령 안내사항</div>
            <div class="p-3 bg-light rounded-3 text-secondary small multiline"
                 th:text="${purchase.pickupNotice != null and !#strings.isEmpty(purchase.pickupNotice) ? purchase.pickupNotice : '등록된 안내가 없습니다.'}">
                안내
            </div>
        </div>

        <div class="mb-4">
            <h3 class="h6 fw-bold mb-2">상품 상세 설명</h3>
            <div class="text-secondary small multiline"
                 th:text="${purchase.description != null and !#strings.isEmpty(purchase.description) ? purchase.description : '아직 등록된 상세 설명이 없습니다.'}">
                설명
            </div>
        </div>

        <div class="alert alert-light border small text-muted mb-0">
            주문 신청은 아직 지원하지 않습니다 (수량 예약 페이지를 이용해주세요).
        </div>
    </div>

</main>

<div th:replace="~{fragments/ui :: footer}"></div>

</body>
</html>
