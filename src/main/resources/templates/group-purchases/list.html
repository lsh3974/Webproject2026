<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공동구매 목록 · 시흥한바구니</title>
    <link rel="stylesheet" th:href="@{/css/group-purchases.css}">
</head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<div th:replace="~{group-purchases/fragments :: header}"></div>
<main id="main" class="container page">
    <h1>공동구매 목록</h1>
    <p>현재 모집 중인 공동구매를 조회합니다.</p>
    <form class="search-form" th:action="@{/group-purchases}" method="get" role="search" aria-label="공동구매 검색">
        <div class="field"><label for="q">상품명·매장명·모집 제목</label><input id="q" name="q" type="search" maxlength="100" th:value="${q}"></div>
        <div class="field"><label for="district">지역</label><input id="district" name="district" maxlength="100" th:value="${district}" placeholder="예: 정왕동"></div>
        <div class="field"><label for="category">카테고리</label><input id="category" name="category" maxlength="100" th:value="${category}" placeholder="예: 채소"></div>
        <div class="actions"><button class="primary" type="submit">검색</button><a th:href="@{/group-purchases}">초기화</a></div>
    </form>

    <p>검색 결과 <strong th:text="${purchases.totalElements}">0</strong>건 · 최신 등록순</p>
    <div class="table-wrap" th:if="${!purchases.empty}">
        <table>
            <caption class="sr-only">모집 중인 공동구매 검색 결과</caption>
            <thead><tr><th scope="col">공동구매 / 상품</th><th scope="col">매장</th><th scope="col">가격</th><th scope="col">현재 / 목표 수량</th><th scope="col">모집 마감</th><th scope="col">조회</th></tr></thead>
            <tbody>
            <tr th:each="item : ${purchases.content}">
                <td><strong th:text="${item.title}">제목</strong><br><small><span th:text="${item.productName}">상품</span> · <span th:text="${item.category}">분류</span></small></td>
                <td th:text="${item.storeName}">매장</td>
                <td><span th:text="${#numbers.formatInteger(item.groupPrice, 1, 'COMMA')}">0</span>원 / <span th:text="${item.unit}">개</span></td>
                <td><span th:text="${item.currentQuantity}">0</span> / <span th:text="${item.targetQuantity}">0</span> <span th:text="${item.unit}">개</span></td>
                <td th:text="${#temporals.format(item.endAt, 'yyyy.MM.dd HH:mm')}">마감</td>
                <td><a th:href="@{/group-purchases/{id}(id=${item.id})}" th:aria-label="${item.title + ' 상세 보기'}">상세 보기</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="notice" th:if="${purchases.empty}">
        <p>조건에 맞는 공동구매가 없어요.</p>
        <a th:href="@{/group-purchases}">전체 목록 보기</a>
    </div>
    <nav class="pagination" aria-label="목록 페이지" th:if="${purchases.totalPages > 1 or purchases.number > 0}">
        <a th:if="${purchases.number > 0}" th:href="@{/group-purchases(q=${q},district=${district},category=${category},page=${purchases.number - 1})}">← 이전</a>
        <span th:if="${purchases.totalPages > purchases.number}" th:text="|${purchases.number + 1} / ${purchases.totalPages}|">1 / 1</span>
        <a th:if="${purchases.hasNext()}" th:href="@{/group-purchases(q=${q},district=${district},category=${category},page=${purchases.number + 1})}">다음 →</a>
    </nav>
</main>
<div th:replace="~{group-purchases/fragments :: footer}"></div>
</body>
</html>
