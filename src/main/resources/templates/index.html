<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시흥한바구니</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom">
    <div class="container d-flex flex-wrap gap-3">
        <a class="navbar-brand fw-bold text-success" th:href="@{/}">
            시흥한바구니
        </a>

        <div sec:authorize="isAnonymous()"
             class="d-flex align-items-center gap-2">
            <a th:href="@{/login}" class="btn btn-outline-success">
                로그인
            </a>
            <a th:href="@{/signup}" class="btn btn-success">
                회원가입
            </a>
        </div>

        <div sec:authorize="isAuthenticated()"
             class="d-flex align-items-center gap-3">
            <a th:href="@{/seller/stores}" class="btn btn-outline-success btn-sm">
                내 매장 관리
            </a>

            <span>
                <strong th:text="${#authentication.principal.displayName}">
                    닉네임
                </strong>님
            </span>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-secondary">
                    로그아웃
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h1 class="fw-bold">우리 동네 공동구매</h1>
    <p class="text-secondary">
        필요한 만큼 함께 구매하고, 가까운 매장에서 수령하세요.
    </p>

    <section class="card border-0 shadow-sm mt-4"
             aria-labelledby="campaign-heading">
        <div class="card-body p-4">
            <h2 id="campaign-heading" class="h5">모집 중인 공동구매</h2>
            <p class="text-secondary mb-0">
                공동구매 목록을 준비 중입니다.
            </p>
        </div>
    </section>
</main>

</body>
</html>
