<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시흥한바구니</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom">
    <div class="container d-flex flex-wrap gap-3">
        <a class="navbar-brand fw-bold text-success" th:href="@{/}">
            시흥한바구니
        </a>

        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/group-purchases}" class="text-decoration-none text-secondary">
                공동구매 둘러보기
            </a>
        </div>

        <div sec:authorize="isAnonymous()"
             class="d-flex align-items-center gap-2">
            <a th:href="@{/login}" class="btn btn-outline-success">
                로그인
            </a>
            <a th:href="@{/signup}" class="btn btn-success">
                회원가입
            </a>
        </div>

        <div sec:authorize="isAuthenticated()"
             class="d-flex align-items-center flex-wrap gap-2">
            <a th:href="@{/orders}" class="btn btn-outline-primary btn-sm">
                내 주문·예약
            </a>

            <!-- 판매자(ROLE_SELLER) 권한이 있는 사용자에게만 매장 관리 버튼 표시 -->
            <a sec:authorize="hasRole('SELLER')"
               th:href="@{/seller/stores}" class="btn btn-outline-success btn-sm">
                내 매장 관리
            </a>

            <span class="ms-1">
                <strong th:text="${#authentication.principal.displayName}">
                    닉네임
                </strong>님
            </span>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-secondary btn-sm">
                    로그아웃
                </button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <h1 class="fw-bold mb-2">우리 동네 공동구매</h1>
            <p class="text-secondary mb-0">
                필요한 만큼 수량을 예약하고, 가까운 매장에서 신선하게 수령하세요.
            </p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/group-purchases}" class="btn btn-outline-success">
                공동구매 둘러보기
            </a>
            <a sec:authorize="isAuthenticated()" th:href="@{/orders}" class="btn btn-outline-dark">
                내 주문·예약 확인
            </a>
        </div>
    </div>

    <section aria-labelledby="campaign-heading">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 id="campaign-heading" class="h5 fw-bold mb-0">모집 중인 공동구매</h2>
            <span class="text-secondary small"
                  th:if="${openGroupPurchases != null}"
                  th:text="'진행 중 ' + ${#lists.size(openGroupPurchases)} + '건'">진행 중 0건</span>
        </div>

        <div th:if="${#lists.isEmpty(openGroupPurchases)}"
             class="card border-0 shadow-sm">
            <div class="card-body p-5 text-center">
                <p class="text-secondary fs-5 mb-2">현재 모집 중인 공동구매가 없습니다.</p>
                <p class="text-muted small mb-0">새로운 우리 동네 공동구매가 열리면 이곳에 표시됩니다.</p>
            </div>
        </div>

        <div th:unless="${#lists.isEmpty(openGroupPurchases)}" class="row g-4">
            <div class="col-12 col-md-6 col-lg-4" th:each="gp : ${openGroupPurchases}">
                <div class="card h-100 border-0 shadow-sm overflow-hidden">
                    <div th:if="${gp.productImageUrl != null and !#strings.isEmpty(gp.productImageUrl)}"
                         style="height: 190px; background-color: #f8f9fa;">
                        <img th:src="${gp.productImageUrl}"
                             th:alt="${gp.productName}"
                             class="w-100 h-100"
                             style="object-fit: cover;"
                             onerror="this.parentElement.style.display='none'">
                    </div>

                    <div class="card-body d-flex flex-column p-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-success-subtle text-success border border-success-subtle"
                                  th:text="${gp.storeName}">매장명</span>
                            <span class="badge bg-light text-secondary border"
                                  th:text="${gp.category}">카테고리</span>
                        </div>

                        <h3 class="h5 fw-bold mb-1">
                            <a th:href="@{/group-purchases/{id}(id=${gp.id})}"
                               class="text-decoration-none text-dark"
                               th:text="${gp.title}">공동구매 제목</a>
                        </h3>
                        <p class="text-secondary small mb-3">
                            <span th:text="${gp.productName}">상품명</span>
                            (<span th:text="${gp.unit}">개</span>)
                        </p>

                        <div class="mb-3">
                            <div class="d-flex align-items-baseline gap-2">
                                <span class="fs-4 fw-bold text-success"
                                      th:text="${#numbers.formatInteger(gp.groupPrice, 1, 'COMMA')} + '원'">8,500원</span>
                                <span class="text-decoration-line-through text-muted small"
                                      th:if="${gp.regularPrice != null and gp.regularPrice > gp.groupPrice}"
                                      th:text="${#numbers.formatInteger(gp.regularPrice, 1, 'COMMA')} + '원'">10,000원</span>
                            </div>
                        </div>

                        <!-- 달성률 진행 바 -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between small text-secondary mb-1">
                                <span>달성률 <strong th:text="${gp.achievementRate} + '%'">0%</strong></span>
                                <span th:text="${gp.totalOccupiedQuantity} + ' / ' + ${gp.targetQuantity} + ' ' + ${gp.unit}">0 / 10 개</span>
                            </div>
                            <div class="progress" style="height: 8px;">
                                <div class="progress-bar bg-success"
                                     role="progressbar"
                                     th:style="'width: ' + ${gp.achievementRate > 100 ? 100 : gp.achievementRate} + '%;'"
                                     th:aria-valuenow="${gp.achievementRate}"
                                     aria-valuemin="0"
                                     aria-valuemax="100"></div>
                            </div>
                        </div>

                        <div class="small text-secondary mb-3">
                            <div>잔여 예약 가능: <strong class="text-dark" th:text="${gp.remainingQuantity} + ' ' + ${gp.unit}">10 개</strong></div>
                            <div>모집 마감: <span th:text="${#temporals.format(gp.endAt, 'yyyy-MM-dd HH:mm')}">마감일시</span></div>
                        </div>

                        <div class="mt-auto d-grid gap-2">
                            <a th:if="${gp.orderable}"
                               th:href="@{/orders/new(groupPurchaseId=${gp.id})}"
                               class="btn btn-success">
                                수량 예약하기
                            </a>
                            <button th:unless="${gp.orderable}"
                                    class="btn btn-secondary"
                                    disabled
                                    th:title="${gp.unavailableReason}">
                                예약 마감
                            </button>
                            <a th:href="@{/group-purchases/{id}(id=${gp.id})}"
                               class="btn btn-outline-secondary btn-sm">
                                상세 보기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

</body>
</html>
