spring.application.name=Hanbaguni
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/hanbaguni}
spring.datasource.username=${DB_USERNAME:hanbaguni_app}
spring.datasource.password=${DB_PASSWORD}
payment.toss.client-key=${TOSS_CLIENT_KEY:}
payment.toss.secret-key=${TOSS_SECRET_KEY:}
spring.jpa.hibernate.ddl-auto=none
# 12번 알림 기능
hanbaguni.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
hanbaguni.notifications.base-url=${APP_BASE_URL:http://localhost:8080}
hanbaguni.notifications.outbox-delay-ms=3000
hanbaguni.notifications.delivery-delay-ms=5000
hanbaguni.notifications.email.host=${MAIL_HOST:}
hanbaguni.notifications.email.from=${NOTIFICATION_EMAIL_FROM:}
hanbaguni.notifications.solapi.api-key=${SOLAPI_API_KEY:}
hanbaguni.notifications.solapi.api-secret=${SOLAPI_API_SECRET:}
hanbaguni.notifications.solapi.from=${SOLAPI_FROM:}
hanbaguni.notifications.push.public-key=${PUSH_VAPID_PUBLIC_KEY:}
hanbaguni.notifications.push.private-key=${PUSH_VAPID_PRIVATE_KEY:}
hanbaguni.notifications.push.subject=${PUSH_VAPID_SUBJECT:mailto:admin@example.com}

# SMTP (이메일 채널을 켤 때만 설정)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

hanbaguni.notifications.reconcile-delay-ms=60000
spring.task.scheduling.pool.size=4
